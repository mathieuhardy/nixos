[languagetool]
binary   = "languagetool-http-server"
url      = "http://localhost:8081"
language = "fr"

[grammalecte]
binary   = "grammalecte-server.py"
url      = "http://localhost:8080"

[app]
default_analyzer    = "grammalecte"
last_project        = "/home/mhardy/dev/tetiaroa"
